 if(e.ds>0){e.ds-=dt;e.sp=0;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.ds<=0)e.sp=e.bs}
 else if(e.tl>0){e.tl-=dt;e.sp=0;e.fl=(T*12|0)%2?.05:0;if(e.tl<=0){e.vx=Math.cos(a)*520;e.vy=Math.sin(a)*520;e.ds=.6}}
 else if(tr!==2&&e.t3<=0){e.t3=tr===1?7:6;e.tl=.9}
 if(e.t1<=0){e.t1=tr===1?2.6:tr===2?.14:2.1;
  if(tr===2){e.sa=(e.sa||0)+.45;shot(e,e.sa,260,10)}
  else{const n=tr===1?14:22,o=R()*TAU;for(let i=0;i<n;i++)shot(e,o+i*TAU/n,tr===1?190:220,12)}}
 if(tr>=2&&e.t2<=0){e.t2=tr===2?3:2.5;for(let i=-1;i<=1;i++)shot(e,a+i*.22,330,14)}}
function bossDown(e){BO=null;bi++;EB=[];burst(e.x,e.y,'#ffd24a',90);for(let i=0;i<12;i++)G.push({x:e.x+(R()-.5)*140,y:e.y+(R()-.5)*140,v:5,m:1});P.hp=P.mx;shake=26;sfx(120,.9,'sawtooth',.14);
 if(bi>=3){S='win';msg='';setTimeout(()=>{if(S==='win')win()},1600)}else{msg='보스 격파! 체력이 모두 회복됐다';mt=2.2}}
function win(){const sc=K*10+(T|0)+3000;if(sc>best){best=sc;try{localStorage.setItem('dg_best',best)}catch(e){}}$('dt').textContent='스테이지 클리어!';$('dt').className='';$('rs').innerHTML=`보스 3마리 격파 · 생존 ${fmt(T)} · 처치 ${K} · 레벨 ${P.lv}<br>점수 <b>${sc}</b> / 최고 ${best}`;sh('d',1)}
function pick(k){
 if(k===0){for(const q of G)q.m=1;FX.push({x:P.x,y:P.y,r:0,l:.5,v:1400,c:'#5c7cff'});msg='자석! 구슬이 모두 끌려온다';sfx(700,.25,'triangle',.07)}
 else if(k===1){const d=250+T*1.5;for(const e of E)if(e.hp>0&&(e.x-P.x)**2+(e.y-P.y)**2<310*310)hit(e,d);FX.push({x:P.x,y:P.y,r:0,l:.45,v:700,c:'#ffd24a'});burst(P.x,P.y,'#ffd24a',50);shake=18;msg='폭탄! 주변을 쓸어버렸다';sfx(55,.6,'sawtooth',.12)}
 else{P.hp=Math.min(P.mx,P.hp+P.mx*.35);burst(P.x,P.y,'#ff5a6a',16);msg='체력 회복';sfx(880,.25,'triangle',.07)}
 mt=1.6}
function die(){S='dead';joy=null;burst(P.x,P.y,'#4ff0d0',60);sfx(70,.7,'sawtooth',.1);const sc=K*10+(T|0);
 if(sc>best){best=sc;try{localStorage.setItem('dg_best',best)}catch(e){}}
 $('rs').innerHTML=`생존 ${fmt(T)} · 처치 ${K} · 레벨 ${P.lv}<br>점수 <b>${sc}</b> / 최고 ${best}`;setTimeout(()=>{if(S==='dead')sh('d',1)},700)}
function parts(dt){for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}PT=PT.filter(p=>p.l>0);shake*=.88;if(shake<.2)shake=0}
function up(dt){
 T+=dt;
 let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(joy){dx=joy.dx;dy=joy.dy}
 const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
 if(dx)P.f=dx>0?1:-1;P.mv=l>.1;P.x+=dx*P.sp*dt;P.y+=dy*P.sp*dt;P.inv-=dt;
 sp-=dt;if(sp<=0){sp=Math.max(.26,.9-T*.005)*(BO?2.5:1);for(let i=1+(T/100|0);i--&&E.length<280;)spawn()}
 if(T>=nb){nb+=60;if(!BO&&wn<=0){spawn(1);sfx(110,.5,'sawtooth',.08);shake=10}}
 P.cd-=dt;
 if(P.cd<=0&&E.length){let n=null,nd=560*560;for(const e of E){const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<nd){nd=d;n=e}}
  if(n){P.cd=P.rate;const a0=Math.atan2(n.y-P.y,n.x-P.x);for(let i=0;i<P.multi;i++){const a=a0+(i-(P.multi-1)/2)*.22;B.push({x:P.x,y:P.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,l:1.1,p:P.pierce,h:new Set()})}sfx(600+R()*120,.04,'square',.015)}}
 for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  for(const e of E)if(e.hp>0&&!b.h.has(e)&&(e.x-b.x)**2+(e.y-b.y)**2<(e.r+6)**2){hit(e,P.dmg);b.h.add(e);if(b.p--<=0){b.l=0;break}}}
 B=B.filter(b=>b.l>0);
 P.ca+=dt*4.5;
 for(let i=0;i<P.club;i++){const a=P.ca+i*TAU/P.club,x=P.x+Math.cos(a)*72,y=P.y+Math.sin(a)*72;
  for(const e of E)if(e.hp>0&&(e.bt||0)<=T&&(e.x-x)**2+(e.y-y)**2<(e.r+11)**2){hit(e,P.dmg*.7);e.bt=T+.3}}
 for(const e of E){const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;e.fl-=dt;
  if(e.hp>0&&P.inv<=0&&(e.x-P.x)**2+(e.y-P.y)**2<(e.r+P.r)**2){P.hp-=e.dm;P.inv=.7;shake=9;sfx(90,.2,'sawtooth',.07);if(P.hp<=0){die();return}}}
 mt-=dt;for(const f of FX){f.l-=dt;f.r+=dt*f.v}FX=FX.filter(f=>f.l>0);
 it-=dt;if(it<=0){it=16+R()*8;if(IT.length<3){let k=R()*3|0;if(k===2&&P.hp>=P.mx)k=R()*2|0;const a=R()*TAU,d=260+R()*260;IT.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,k,l:45})}}
 for(const o of IT){o.l-=dt;if((o.x-P.x)**2+(o.y-P.y)**2<(P.r+18)**2){o.l=0;pick(o.k)}}
 IT=IT.filter(o=>o.l>0);
 if(bi<3&&!BO&&wn<=0&&T>=300*(bi+1)){wn=2.6;sfx(150,.7,'sawtooth',.1)}
 if(wn>0){wn-=dt;if(wn<=0)spawnBoss(bi)}
 if(BO)bossAI(BO,dt);
 for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(P.inv<=0&&(b.x-P.x)**2+(b.y-P.y)**2<(P.r+6)**2){b.l=0;P.hp-=b.d;P.inv=.7;shake=9;sfx(90,.2,'sawtooth',.07);if(P.hp<=0){die();return}}}
 EB=EB.filter(b=>b.l>0);
 E=E.filter(e=>e.hp>0);
 for(const q of G){const d=Math.hypot(P.x-q.x,P.y-q.y);
  if(d<P.r+8){P.xp+=q.v;q.dead=1;sfx(1000+P.xp*30,.05,'triangle',.03)}
  else if(q.m||d<P.mag){q.m=1;const a=Math.atan2(P.y-q.y,P.x-q.x);q.x+=Math.cos(a)*480*dt;q.y+=Math.sin(a)*480*dt}}
 G=G.filter(q=>!q.dead);
 chk();parts(dt)}
function draw(){
 g.setTransform(DPR,0,0,DPR,0,0);g.imageSmoothingEnabled=false;g.fillStyle='#14112b';g.fillRect(0,0,VW,VH);
 const cx=VW/2-P.x+(shake?(R()-.5)*shake:0),cy=VH/2-P.y+(shake?(R()-.5)*shake:0);
 const S0=768,ox=((Math.round(cx)%S0)+S0)%S0,oy=((Math.round(cy)%S0)+S0)%S0;for(let x=ox-S0;x<VW;x+=S0)for(let y=oy-S0;y<VH;y+=S0)g.drawImage(GBc,x,y);
 
 g.save();g.translate(cx,cy);
 const D=96,i0=Math.floor((P.x-VW/2)/D)-1,i1=Math.floor((P.x+VW/2)/D)+1,j0=Math.floor((P.y-VH/2)/D)-1,j1=Math.floor((P.y+VH/2)/D)+1;
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const h=hs(i,j),m=h%100;if(m>=40)continue;const im=DSc[m<6?0:m<26?1:m<34?2:3];g.drawImage(im,i*D+(h>>>8)%56+8,j*D+(h>>>16)%62+8,im.width*3,im.height*3)}
 for(const q of G)g.drawImage(SP.gem,Math.round(q.x)-5,Math.round(q.y)-5,10,10);
 for(const o of IT){if(o.l<8&&(T*7|0)%2)continue;const im=SI[o.k],w=im.width*3,h=im.height*3,x=Math.round(o.x),y=Math.round(o.y);g.strokeStyle=IH[o.k];g.lineWidth=3;g.globalAlpha=.45+.3*Math.sin(T*6);g.beginPath();g.arc(x,y+6,24,0,TAU);g.stroke();g.globalAlpha=1;g.drawImage(im,Math.round(x-w/2),Math.round(y-h/2)-((T*3|0)%2)*3,w,h)}
 for(const e of E){const im=e.fl>0?WH[e.t==='f'?'f':'b']:SP[e.t],w=im.width*e.s,h=im.height*e.s;g.save();g.translate(Math.round(e.x),Math.round(e.y));g.scale(P.x<e.x?-1:1,1);if(e.boss){const hw=w/2,hn=e.big?22:14;g.fillStyle='#0b0920';g.fillRect(-hw,-h/2-hn-4,hn,hn+6);g.fillRect(hw-hn,-h/2-hn-4,hn,hn+6);g.fillStyle='#ffc94a';g.fillRect(-hw+2,-h/2-hn-2,hn-4,hn+2);g.fillRect(hw-hn+2,-h/2-hn-2,hn-4,hn+2)}g.drawImage(im,-w/2,-h/2,w,h);g.restore();
  
  
  if(e.boss&&!e.big){g.fillStyle='#f3ead8';g.fillRect(Math.round(e.x)-30,Math.round(e.y-h/2-20),Math.round(60*Math.max(0,e.hp)/e.mh),5)}}
 
 for(const b of B)g.drawImage(SP.fire,Math.round(b.x)-5,Math.round(b.y)-5,10,10);
 g.globalCompositeOperation='source-over';
 for(let i=0;i<P.club;i++){const a=P.ca+i*TAU/P.club,x=P.x+Math.cos(a)*72,y=P.y+Math.sin(a)*72;g.drawImage(SP.club,Math.round(x)-10,Math.round(y)-10,21,21)}
 if(S!=='dead'&&(P.inv<=0||(T*18|0)%2)){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(Math.round(P.x)-12,Math.round(P.y)+14,24,5);g.save();g.translate(Math.round(P.x),Math.round(P.y));g.scale(P.f,1);g.drawImage(SP.pl,-18,-20-((T*(P.mv?12:3)|0)%2)*3,36,36);g.restore();
  
  const bx=Math.round(P.x)-18,by=Math.round(P.y)+23;g.fillStyle='#401018';g.fillRect(bx,by,36,4);g.fillStyle='#ff5a6a';g.fillRect(bx,by,Math.floor(36*Math.max(0,P.hp)/P.mx),4)}
 g.globalCompositeOperation='lighter';for(const p of PT){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.globalCompositeOperation='source-over';
 for(const f of FX){g.strokeStyle=f.c;g.lineWidth=6;g.globalAlpha=Math.max(0,f.l*2.2);g.beginPath();g.arc(f.x,f.y,f.r,0,TAU);g.stroke()}g.globalAlpha=1;
 for(const b of EB){const x=Math.round(b.x),y=Math.round(b.y);g.fillStyle='#ff4b6e';g.fillRect(x-5,y-5,10,10);g.fillStyle='#fff';g.fillRect(x-2,y-2,4,4)}
 g.restore();
 const lo=P.hp/P.mx;if(S==='play'&&(lo<.4||P.inv>.45)){const gr=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.3,VW/2,VH/2,Math.hypot(VW,VH)/2),a=P.inv>.45?.35:(.2+.15*Math.sin(T*9))*(1-lo/.4);gr.addColorStop(0,'rgba(200,20,30,0)');gr.addColorStop(1,'rgba(200,20,30,'+Math.max(0,a)+')');g.fillStyle=gr;g.fillRect(0,0,VW,VH)}
 for(const o of IT){const sx=o.x-P.x+VW/2,sy=o.y-P.y+VH/2;if(sx>16&&sx<VW-16&&sy>56&&sy<VH-16)continue;const ax=Math.min(VW-24,Math.max(24,sx)),ay=Math.min(VH-24,Math.max(64,sy));g.save();g.translate(Math.round(ax),Math.round(ay));g.rotate(Math.atan2(o.y-P.y,o.x-P.x));g.fillStyle=IH[o.k];g.globalAlpha=.55+.35*Math.sin(T*8);g.beginPath();g.moveTo(12,0);g.lineTo(-8,-9);g.lineTo(-8,9);g.fill();g.restore()}
 if(mt>0){g.globalAlpha=Math.min(1,mt*2);g.fillStyle='#ffd24a';g.font='bold 22px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';g.textAlign='center';g.fillText(msg,VW/2,76);g.globalAlpha=1}
 if(BO){const bw=Math.min(VW-40,520),bx=Math.round((VW-bw)/2);g.fillStyle='#2a1020';g.fillRect(bx-3,93,bw+6,18);g.fillStyle='#e8452c';g.fillRect(bx,96,Math.max(0,bw*BO.hp/BO.mh),12);g.fillStyle='#f3ead8';g.font='bold 15px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';g.textAlign='center';g.fillText(BN[bi]+' ('+(bi+1)+'/3)',VW/2,90)}
 if(wn>0){g.fillStyle='rgba(190,10,25,'+(.1+.1*Math.sin(T*14))+')';g.fillRect(0,0,VW,VH);g.fillStyle='#ff4b4b';g.textAlign='center';g.font='bold 40px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';g.fillText('경고!',VW/2,VH/2-40);g.font='bold 22px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';g.fillText(BN[bi]+' 출현',VW/2,VH/2)}
 g.fillStyle='#2a2554';g.fillRect(0,0,VW,10);g.fillStyle='#ffc94a';g.fillRect(0,0,VW*Math.min(1,P.xp/P.nx),10);
 g.fillStyle='#f3ead8';g.font='bold 16px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
 g.textAlign='left';g.fillText('Lv.'+P.lv,12,34);g.textAlign='center';g.fillText(fmt(T),VW/2,34);g.textAlign='right';g.fillText('처치 '+K,VW-12,34);
 if(joy){g.strokeStyle='rgba(243,234,216,.5)';g.lineWidth=2;g.beginPath();g.arc(joy.sx,joy.sy,45,0,TAU);g.stroke();g.fillStyle='rgba(79,240,208,.6)';g.beginPath();g.arc(joy.sx+joy.dx*45,joy.sy+joy.dy*45,18,0,TAU);g.fill()}}
let last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(S==='play')up(dt);else if(S==='dead'||S==='win')parts(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
$('go').onclick=()=>{init();sh('t',0);sfx(660,.15,'triangle',.05)};
$('re').onclick=()=>{init();sh('d',0);$('dt').textContent='쓰러졌다';$('dt').className='r'};
